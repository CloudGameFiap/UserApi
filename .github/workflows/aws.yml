name: user-api CI/CD

# Salvar em: .github/workflows/user-api.yml
# Para o CatalogAPI: copie o arquivo e troque ECR_REPOSITORY, DEPLOYMENT, CONTAINER e o caminho do projeto.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: cloudgame/user-api
  EKS_CLUSTER: CloudGame-cluster
  DEPLOYMENT: user-api      # nome do Deployment no Kubernetes
  CONTAINER: user-api       # nome do container dentro do Deployment

jobs:
  # 1) Build e testes unitários (roda também em Pull Request)
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x  

      - name: Restore
        run: dotnet restore CloudGame.sln  

      - name: Build
        run: dotnet build CloudGame.sln --no-restore -c Release

      - name: Testes unitários
        run: dotnet test CloudGame.sln --no-build -c Release

  # 2) Imagem Docker com tag versionada + scan + push para o ECR (so na main)
  docker-push:
   # needs: build-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: latest
        id: meta
        run: |
          TAG=${GITHUB_SHA::7}
          echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:$TAG" >> "$GITHUB_OUTPUT"
          echo "latest=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" >> "$GITHUB_OUTPUT"

      - name: Docker build
        # Ajuste o -f e o contexto conforme a localizacao do seu Dockerfile
        run: docker build -f ./src/CloudGame.API/Dockerfile -t ${{ steps.meta.outputs.image }} -t ${{ steps.meta.outputs.latest }} ./src

      - name: Security scan (Trivy) - desejavel
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          severity: CRITICAL,HIGH
          exit-code: '0'   # mude para '1' se quiser bloquear o deploy com vulnerabilidades

      - name: Push para o ECR
        run: |
          docker push ${{ steps.meta.outputs.image }}
          docker push ${{ steps.meta.outputs.latest }}

